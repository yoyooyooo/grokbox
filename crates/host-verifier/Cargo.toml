[package]
name = "grokbox-host-verifier"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "grokbox-host-verifier"
path = "src/bin/grokbox-host-verifier/main.rs"

[dependencies]
oxc_allocator = "=0.75.0"
oxc_ast = "=0.75.0"
oxc_parser = "=0.75.0"
oxc_semantic = "=0.75.0"
oxc_span = "=0.75.0"
oxc_syntax = "=0.75.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
libc = "=0.2.172"
